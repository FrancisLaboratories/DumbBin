name: Build and Push Docker Image to DockerHub

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      docker_tag:
        description: 'Docker tag to publish (for example 1.2.3 or latest)'
        required: false
        default: 'latest'
      include_latest:
        description: 'Also publish as latest'
        required: false
        type: boolean
        default: true

env:
  DOCKER_IMAGE: francislaboratories/dumbbin
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker tags
        id: docker_meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          MANUAL_TAG: ${{ github.event.inputs.docker_tag || '' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_VALUE="$RELEASE_TAG"
          elif [ -n "$MANUAL_TAG" ]; then
            TAG_VALUE="$MANUAL_TAG"
          else
            TAG_VALUE="$REF_NAME"
          fi

          echo "IMAGE_TAG=$TAG_VALUE" >> "$GITHUB_OUTPUT"

      - name: Build and Push Multi-Platform Image
        env:
          IMAGE_TAG: ${{ steps.docker_meta.outputs.IMAGE_TAG }}
          INCLUDE_LATEST: ${{ github.event.inputs.include_latest || 'true' }}
        run: |
          docker buildx create --use
          BUILD_ARGS=(--platform ${{ env.PLATFORMS }} --tag ${{ env.DOCKER_IMAGE }}:${IMAGE_TAG} --push .)

          if [ "${INCLUDE_LATEST}" = "true" ]; then
            BUILD_ARGS=(--platform ${{ env.PLATFORMS }} --tag ${{ env.DOCKER_IMAGE }}:latest --tag ${{ env.DOCKER_IMAGE }}:${IMAGE_TAG} --push .)
          fi

          docker buildx build "${BUILD_ARGS[@]}"
